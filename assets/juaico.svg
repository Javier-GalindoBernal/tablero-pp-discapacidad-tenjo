<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="JUAICO, asistente de la política de discapacidad">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B7A3B"/><stop offset="1" stop-color="#033D1C"/>
    </linearGradient>
    <linearGradient id="cara" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6F1EA"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A3F22"/><stop offset="1" stop-color="#05291A"/>
    </linearGradient>
    <radialGradient id="ojo" cx=".5" cy=".4" r=".6">
      <stop offset="0" stop-color="#FFF6C2"/><stop offset=".55" stop-color="#F6D32E"/><stop offset="1" stop-color="#E8BE07"/>
    </radialGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".28"/></filter>
    <clipPath id="circ"><circle cx="120" cy="120" r="116"/></clipPath>
  </defs>

  <!-- Fondo -->
  <circle cx="120" cy="120" r="116" fill="url(#bg)"/>
  <g clip-path="url(#circ)" opacity=".9">
    <rect x="168" y="168" width="16" height="110" rx="8" fill="#1F6FB2" transform="rotate(45 176 223)"/>
    <rect x="192" y="152" width="16" height="110" rx="8" fill="#E8BE07" transform="rotate(45 200 207)"/>
    <rect x="216" y="136" width="16" height="110" rx="8" fill="#2FA45C" transform="rotate(45 224 191)"/>
  </g>
  <circle cx="120" cy="120" r="104" fill="none" stroke="#E8BE07" stroke-width="3" stroke-dasharray="4 10" opacity=".55"/>

  <!-- Antena con chispa de IA -->
  <line x1="120" y1="64" x2="120" y2="44" stroke="#E6F1EA" stroke-width="5" stroke-linecap="round"/>
  <path d="M120 22 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5z" fill="#F6D32E"/>
  <circle cx="146" cy="30" r="3.5" fill="#FFF6C2"/>
  <circle cx="95" cy="36" r="2.5" fill="#FFF6C2"/>

  <!-- Cabeza -->
  <g filter="url(#sombra)">
    <rect x="58" y="62" width="124" height="104" rx="40" fill="url(#cara)"/>
    <rect x="48" y="96" width="14" height="34" rx="7" fill="#E8BE07"/>
    <rect x="178" y="96" width="14" height="34" rx="7" fill="#1F6FB2"/>
    <rect x="72" y="82" width="96" height="60" rx="26" fill="url(#visor)"/>
    <!-- Ojos -->
    <ellipse cx="101" cy="108" rx="10" ry="12" fill="url(#ojo)"/>
    <ellipse cx="139" cy="108" rx="10" ry="12" fill="url(#ojo)"/>
    <circle cx="104" cy="104" r="3" fill="#fff"/>
    <circle cx="142" cy="104" r="3" fill="#fff"/>
    <!-- Sonrisa -->
    <path d="M104 126 q16 12 32 0" fill="none" stroke="#7CD39B" stroke-width="5" stroke-linecap="round"/>
    <!-- Mejillas -->
    <circle cx="82" cy="134" r="5" fill="#7DB6E8" opacity=".7"/>
    <circle cx="158" cy="134" r="5" fill="#7DB6E8" opacity=".7"/>
  </g>

  <!-- Cuerpo: manos que forman un corazón (inclusión) -->
  <g filter="url(#sombra)">
    <path d="M78 214 q0 -40 42 -42 q42 2 42 42z" fill="#E6F1EA"/>
    <path d="M120 206 c-16 -12 -26 -20 -26 -31 c0 -8 6 -13 13 -13 c6 0 10 4 13 9 c3 -5 7 -9 13 -9 c7 0 13 5 13 13 c0 11 -10 19 -26 31z" fill="#E8BE07"/>
    <path d="M120 198 c-10 -8 -17 -14 -17 -21 c0 -4 3 -7 7 -7 c4 0 7 3 10 7z" fill="#055B2A" opacity=".18"/>
  </g>

  <!-- Burbuja de conversación -->
  <g filter="url(#sombra)">
    <path d="M176 156 h40 a10 10 0 0 1 10 10 v18 a10 10 0 0 1 -10 10 h-24 l-10 9 v-9 h-6 a10 10 0 0 1 -10 -10 v-18 a10 10 0 0 1 10 -10z" fill="#FFFFFF"/>
    <circle cx="186" cy="175" r="3.6" fill="#055B2A"/>
    <circle cx="198" cy="175" r="3.6" fill="#E8BE07"/>
    <circle cx="210" cy="175" r="3.6" fill="#1F6FB2"/>
  </g>
</svg>
